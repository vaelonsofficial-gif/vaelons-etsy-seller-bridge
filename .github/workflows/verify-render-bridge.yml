name: Verify Render bridge

on:
  push:
    branches:
      - feature/render-oauth-bridge
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --check src/server-core.js
      - run: node --check src/render-price-bridge.js
