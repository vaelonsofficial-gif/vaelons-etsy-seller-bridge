openapi: 3.1.0

info:
  title: VAELONS SEO Manager
  version: 4.1.0
  description: SEO-only VAELONS Etsy manager. No thumbnail generation. Manager GPT creates SEO proposals; backend validates, previews, publishes only with approval, and supports rollback.

servers:
  - url: https://vaelons-etsy-seller-bridge-3dql.vercel.app

components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []

paths:
  /api/token-status:
    get:
      operationId: getEtsyConnectionStatus
      summary: Check Etsy connection
      responses:
        "200":
          description: OK

  /api/manager/status:
    get:
      operationId: getManagerStatus
      summary: Get SEO-only Manager status
      responses:
        "200":
          description: OK

  /api/manager/bootstrap:
    get:
      operationId: getManagerBootstrap
      summary: Read Manager status and one Etsy listing page
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: state
          in: query
          required: false
          schema:
            type: string
            default: active
      responses:
        "200":
          description: OK

  /api/shop:
    get:
      operationId: getVaelonsShop
      summary: Read VAELONS Etsy shop
      responses:
        "200":
          description: OK

  /api/listings:
    get:
      operationId: listVaelonsListings
      summary: Read Etsy listings
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: state
          in: query
          required: false
          schema:
            type: string
            default: active
      responses:
        "200":
          description: OK

  /api/listings/{listingId}:
    get:
      operationId: getVaelonsListing
      summary: Read one Etsy listing
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /api/seo/health:
    get:
      operationId: getSeoEngineStatus
      summary: Get SEO engine status
      description: Confirms that SEO uses Manager-generated proposals and no backend OpenAI API call.
      responses:
        "200":
          description: OK

  /api/seo/listings:
    get:
      operationId: listSeoListings
      summary: Read listing SEO fields
      description: Returns title, tags and description for Manager-side SEO analysis. Read only.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: state
          in: query
          required: false
          schema:
            type: string
            default: active
      responses:
        "200":
          description: OK

  /api/seo/scan:
    post:
      operationId: scanSeoStructure
      summary: Run structural SEO scan without OpenAI API
      description: Checks title length, tag count and description presence. Semantic SEO judgment remains with Manager GPT. Never modifies Etsy.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 100
                offset:
                  type: integer
                  minimum: 0
                  default: 0
                state:
                  type: string
                  default: active
      responses:
        "200":
          description: OK
        default:
          description: Error

  /api/seo/listings/{listingId}/prepare:
    post:
      operationId: prepareSeoOptimization
      summary: Validate and save Manager-generated SEO proposal
      description: Manager GPT supplies proposed title, tags and/or description. Backend makes no OpenAI call and never publishes in this step.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                proposed_title:
                  type: string
                proposed_tags:
                  type: array
                  items:
                    type: string
                  minItems: 13
                  maxItems: 13
                proposed_description:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Preview ready or no changes
        "422":
          description: Deterministic validation blocked proposal
        default:
          description: Error

  /api/seo/batch-prepare:
    post:
      operationId: batchPrepareSeoOptimizations
      summary: Validate up to 20 Manager-generated SEO proposals
      description: Creates preview tokens without any backend OpenAI call. Never publishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - listing_id
                    properties:
                      listing_id:
                        type: integer
                      proposed_title:
                        type: string
                      proposed_tags:
                        type: array
                        items:
                          type: string
                        minItems: 13
                        maxItems: 13
                      proposed_description:
                        type: string
                      reason:
                        type: string
      responses:
        "200":
          description: Batch preview result
        default:
          description: Error

  /api/seo/listings/{listingId}/status:
    get:
      operationId: getSeoOptimizationStatus
      summary: Read SEO preview or publish state
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /api/seo/listings/{listingId}/publish:
    post:
      operationId: publishSeoOptimization
      summary: Publish an approved SEO preview
      description: Etsy write action. Requires preview token and exact ONAYLIYORUM approval.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - preview_token
                - approval
              properties:
                preview_token:
                  type: string
                approval:
                  type: string
                  enum:
                    - ONAYLIYORUM
      responses:
        "200":
          description: Published and verified
        default:
          description: Error

  /api/seo/listings/{listingId}/rollback:
    post:
      operationId: rollbackSeoOptimization
      summary: Roll back the most recent successful SEO publish
      description: Etsy write action. Requires exact GERI_AL ONAYLIYORUM approval.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - approval
              properties:
                approval:
                  type: string
                  enum:
                    - GERI_AL ONAYLIYORUM
      responses:
        "200":
          description: Rolled back and verified
        default:
          description: Error


  /api/variation-intelligence/status:
    get:
      operationId: getVariationIntelligenceStatus
      summary: Check read-only variation intelligence readiness
      responses:
        "200":
          description: OK

  /api/variation-intelligence/scan:
    get:
      operationId: scanVariationIntelligence
      summary: Scan VAELONS listing inventory and variation structure
      description: Read-only. Uses Etsy batch inventory reads and never modifies listings.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            default: active
        - name: listing_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 300
        - name: include_rows
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: sample_rows
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 20
            default: 3
      responses:
        "200":
          description: Read-only variation scan result

  /api/variation-intelligence/listings/{listingId}:
    get:
      operationId: getListingVariationIntelligence
      summary: Read full variation inventory for one VAELONS listing
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing variation rows and summary

  /api/variation-intelligence/evaluate/{listingId}:
    post:
      operationId: evaluateListingProfit
      summary: Evaluate listing contribution margin and maximum ad spend
      description: Read-only profit model. Requires caller-supplied cost rules, USD/TRY rate and Etsy net ratio. Does not change Etsy.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - etsy_net_ratio
                - usd_try
                - costs
              properties:
                etsy_net_ratio:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1
                usd_try:
                  type: number
                  exclusiveMinimum: 0
                target_profit_try:
                  type: number
                  default: 0
                costs:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - cost_try
                    properties:
                      canvas_style:
                        type: string
                      size:
                        type: string
                      frame_color:
                        type: string
                      cost_try:
                        type: number
      responses:
        "200":
          description: Read-only profitability rows
        "400":
          description: Invalid assumptions
