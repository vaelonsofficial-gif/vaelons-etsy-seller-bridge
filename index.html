function anniversary(day){const [y,m,d]=day.slice(0,10).split('-').map(Number);return [y+1,String(m).padStart(2,'0'),String(Math.min(d,new Date(y+1,m,0).getDate())).padStart(2,'0')].join('-')}

function customerResults(customers, query) {
  const needle = query.trim().toLocaleLowerCase('tr-TR');
  const digits = /^[+\d\s()-]+$/.test(needle) ? needle.replace(/\D/g, '') : '';
  const matches = customers.filter(c => c.name.toLocaleLowerCase('tr-TR').includes(needle)
    || (digits && (c.phone || '').replace(/\D/g, '').includes(digits)));
  return matches.map(c => btn(c.name, 'customer/' + c.id)).join('')
    || (needle ? '<p>Eşleşen müşteri yok.</p>' : '<p>Henüz müşteri kaydı yok.</p>');
}
const addressField = value => field('Servis adresi (isteğe bağlı)', 'address', 'text', value || '', '');
function addressCard(customer) {
  const address = customer?.address?.trim();
  if (!address) return '';
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return '<section class="service-address screen"><h3>Servis adresi</h3><p>' + esc(address) +
    '</p><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Haritada aç ↗</a></section>';
}
function whatsAppMessage(job, customerName, phone) {
  if (!phone) return '';
  const appointment = job.status === 'active';
  const [year, month, day] = job.date.slice(0, 10).split('-');
  const message = appointment
    ? 'Merhaba ' + customerName + ', ' + job.title + ' için randevunuzu hatırlatmak istedim. Randevunuz ' + day + '.' + month + '.' + year + ' tarihinde saat ' + job.date.slice(11, 16) + '. Görüşmek üzere.'
    : 'Merhaba ' + customerName + ', ' + job.title + ' hakkında size ulaşıyorum.';
  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
  const link = '<a class="button" target="_blank" rel="noopener noreferrer" href="' + esc(url) + '">';
  if (!appointment) return link + 'WhatsApp mesajı hazırla</a>';
  return '<details><summary>WhatsApp randevu hatırlatması</summary><p>' + esc(message) +

function downloadBackup(records) {
  const timestamp = new Date();
  const payload = { application: 'İş Bitti', formatVersion: 1, exportedAt: timestamp.toISOString(), records };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'is-bitti-yedek-' + timestamp.toISOString().replace(/[:.]/g, '-') + '.json';
  document.body.appendChild(link);
  try { link.click(); } finally {
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
}
function validFollowups(entries) {
  const date = value => typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value);
  return entries == null || (typeof entries==='object' && !Array.isArray(entries) &&
    Object.entries(entries).every(([index,item])=>/^\d+$/.test(index) && item && date(item.date) && (item.checked==='' || date(item.checked))));
}
function readBackup(text) {
  const file = JSON.parse(text);
  const records = file?.records;
  const reject = () => { throw Error('Geçersiz İş Bitti yedeği.'); };
  if (file?.application !== 'İş Bitti' || file.formatVersion !== 1 ||
      !Array.isArray(records?.customers) || !Array.isArray(records?.jobs)) reject();
  const validId = id => typeof id === 'string' && /^[a-zA-Z0-9_-]+$/.test(id);
  const nonempty = value => typeof value === 'string' && value.trim().length > 0;
  const customers = new Set(), jobs = new Set();
  for (const c of records.customers) {
    if (!c || !validId(c.id) || customers.has(c.id) || !nonempty(c.name) ||
        typeof c.phone !== 'string' || (c.address != null && typeof c.address !== 'string')) reject();
    customers.add(c.id);
  }
  for (const j of records.jobs) {
    if (!j || !validId(j.id) || jobs.has(j.id) || !customers.has(j.customer) ||
        !nonempty(j.title) || !nonempty(j.date) || !/^\d{4,}-\d\d-\d\dT\d\d:\d\d/.test(j.date) ||
        !Object.hasOwn(labels,j.status) || !Array.isArray(j.materials) || !validFollowups(j.followups) || ['trade','serviceType','subject','request'].some(k => j[k] != null && typeof j[k] !== 'string') || (j.note != null && typeof j.note !== 'string') ||
        (j.completed != null && (typeof j.completed !== 'string' || !/^\d{4}-\d\d-\d\d$/.test(j.completed))) ||
        j.materials.some(m => !m || !nonempty(m.name) || !Number.isFinite(m.qty) || m.qty <= 0 ||
          !Number.isFinite(m.price) || m.price < 0)) reject();
    jobs.add(j.id);
  }
  return records;
}

function checkpoints(job) {
  const titles = Array.isArray(job.tasks) && job.tasks.length && job.tasks.every(t=>typeof t==='string') ? job.tasks : [job.title];
  return titles.map((title,index) => {
    const entry = job.followups?.[index];
    return {title,index,job,date:entry?.date || anniversary(job.completed || job.date),checked:entry?.checked || ''};
  });
}

function localDay(day){
  const value = /^\d{4}-\d{2}-\d{2}$/.test(day || '') ? new Date(day+'T12:00:00') : null;
  return value && Number.isFinite(value.getTime()) && dayKey(value)===day ? value : new Date(today()+'T12:00:00');
}
function dayKey(value){
  return [value.getFullYear(),String(value.getMonth()+1).padStart(2,'0'),String(value.getDate()).padStart(2,'0')].join('-');
}
function shiftDay(value, count){
  const day=new Date(value);
  day.setDate(day.getDate()+count);
  return day;
}
const workDays=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
function workRange(db, day){
  return db.workHours?.[(localDay(day).getDay()+6)%7] ?? {open:true,start:'00:00',end:'23:59'};
}
function duringHours(range,time){
  return range.open && time>=range.start && time<=range.end;
}
function workHoursForm(db){
  const rows=workDays.map((name,i)=>{
    const range=db.workHours?.[i] ?? {open:true,start:'00:00',end:'23:59'};
    return '<fieldset class="work-day"><legend>'+name+'</legend><label><input type="checkbox" name="open'+i+'" '+(range.open?'checked':'')+'> Çalışıyorum</label>'+
      field('İlk randevu','start'+i,'time',range.start,range.open?'required':'disabled')+
      field('Son randevu','end'+i,'time',range.end,range.open?'required':'disabled')+'</fieldset>';
  }).join('');
  return '<details><summary>Haftalık çalışma saatlerim</summary>'+form('work-hours',rows,'Çalışma saatlerini kaydet')+'</details>';
}
function weekPlanner(db, rawDay, list){
  const selected=localDay(rawDay), day=dayKey(selected);
  const monday=shiftDay(selected,-((selected.getDay()+6)%7));
  const schedule=jobsFor(db,'active');
  const days=Array.from({length:7},(_,i)=>shiftDay(monday,i));
  const daily=schedule.filter(job=>job.date.slice(0,10)===day);
  const range=workRange(db,day);
  const booked=new Set(daily.map(job=>job.date.slice(11,16)));
  const choices=Array.from({length:24},(_,h)=>String(h).padStart(2,'0')+':00')
    .filter(time=>duringHours(range,time) && !booked.has(time)).map(time=>'<option value="'+time+'"></option>').join('');
  const people=db.customers.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr'))
    .map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
  const booking=people ? serviceForm(false,{day,people,choices}) : btn('İlk müşteriyi ekle','new-for-day/'+day);
  return '<h2>Haftalık randevular</h2>'+workHoursForm(db)+'<div class="week-heading"><a href="#week/'+dayKey(shiftDay(selected,-7))+'" aria-label="Önceki hafta">‹</a><strong>'+shortDate.format(monday)+' – '+shortDate.format(days[6])+' '+days[6].getFullYear()+'</strong><a href="#week/'+dayKey(shiftDay(selected,7))+'" aria-label="Sonraki hafta">›</a></div>'+
    '<div class="week-days">'+days.map(date=>{
      const key=dayKey(date), open=workRange(db,key).open, count=schedule.filter(job=>job.date.slice(0,10)===key).length;
      return '<a href="#week/'+key+'" aria-label="'+longDate.format(date)+', '+count+' randevu" '+(key===day?'aria-current="date"':'')+'><span>'+weekday.format(date)+'</span><strong>'+date.getDate()+'</strong><small>'+(open || count ? count : 'Kapalı')+'</small></a>';
    }).join('')+'</div><section class="panel"><h3>'+longDate.format(selected)+'</h3>'+
    (db.workHours ? '<p>'+(range.open ? 'Randevu saatleri · '+esc(range.start)+' – '+esc(range.end) : 'Çalışılmayan gün')+'</p>' : '')+(daily.length?list(daily):'<p>Bu güne kayıtlı randevu yok.</p>')+'</section>'+(range.open ? '<h3>Bu güne randevu ver</h3>'+
    (people?btn('Yeni müşteri ekle','new-for-day/'+day):'')+booking : '');
}

function confirmAppointmentTime(db, date, currentJobId) {
  const range=workRange(db,date.slice(0,10));
  if(!duringHours(range,date.slice(11,16))){
    alert(range.open ? 'Bu gün için '+range.start+' ile '+range.end+' arasında bir saat seçin.' : 'Bu gün çalışılmıyor. Başka bir gün seçin.');
    return false;
  }
  const conflicts = db.jobs.filter(job => job.status === 'active' &&
    job.id !== currentJobId && job.date.slice(0, 16) === date.slice(0, 16));
  if (!conflicts.length) return true;
  const appointments = conflicts.map(job => {
    const customer = db.customers.find(person => person.id === job.customer);
    return (customer?.name || 'Müşteri') + ' · ' + job.title;
  });
  return confirm('Aynı saatte kayıtlı randevu var.\n\n' + appointments.join('\n') +
    '\n\nBu saati yine de kaydetmek istiyor musun?');
}
function render(){
let db;try{db=JSON.parse(localStorage.getItem(key)||'{"customers":[],"jobs":[]}');if(!Array.isArray(db.jobs)||!Array.isArray(db.customers))throw Error()}catch{root.textContent='Cihazdaki kayıtlar okunamadı.';return}
const [page,id]=location.hash.slice(1).split('/'), c=db.customers.find(x=>x.id===id),j=db.jobs.find(x=>x.id===id);
const name=j=>db.customers.find(c=>c.id===j.customer)?.name||'Müşteri';
const list = rows => rows.length ? rows.map(x =>

let h='';
if(page==='week'){h=weekPlanner(db,id,list)}
else if(page==='new-for-day'){h='<h2>Yeni müşteri</h2>'+form('customer',field('Müşteri adı','name')+field('WhatsApp numarası (isteğe bağlı)','phone','tel','','')+addressField(''),'Müşteriyi kaydet')}
else if(page==='list'){h='<h2>'+esc(labels[id]||'Toplam iş')+'</h2>'+list(jobsFor(db,id))}
else if(page==='customers'){h='<h2>Müşteriler</h2><label>Müşteri ara<input id="customer-search" type="search" placeholder="Ad veya telefon numarası"></label><div id="customer-results">'+customerResults(db.customers,'')+'</div>'+form('customer',field('Müşteri adı','name')+field('WhatsApp numarası (isteğe bağlı)','phone','tel','','')+addressField(''),'Müşteri ekle')}
else if(page==='customer'&&c){h='<h2>'+esc(c.name)+'</h2>'+addressCard(c)+'<details><summary>Müşteri bilgilerini düzenle</summary>'+form('edit-customer',field('Müşteri adı','name','text',c.name)+field('Telefon','phone','tel',c.phone,'')+addressField(c.address),'Değişiklikleri kaydet')+'</details>'+'<datalist id="service-types">'+serviceTypes.map(t=>'<option value="'+esc(t)+'"></option>').join('')+'</datalist><h3>Randevu oluştur</h3>'+serviceForm(false)+'<details><summary>Yapılmış servis kaydı ekle</summary>'+serviceForm(true)+'</details>'+'<h3>Müşteri geçmişi</h3>'+list(jobsFor(db,'all').filter(x=>x.customer===id))}
else if(page==='maintenance'){h=followupPanel(db,name)}
else if(page==='job'&&j){let phone=String(db.customers.find(x=>x.id===j.customer)?.phone||'').replace(/\D/g,'');if(/^0\d{10}$/.test(phone))phone='90'+phone.slice(1);if(/^\d{10}$/.test(phone))phone='90'+phone;
h='<article><h2>'+esc(j.title)+'</h2><p>'+esc(name(j))+' · '+esc(labels[j.status])+'</p><p>'+(j.directService===true?'Servis':'Randevu')+' '+esc(j.date.replace('T',' '))+'</p>'+serviceDescription(j)+addressCard(db.customers.find(customer => customer.id === j.customer))+(j.completed?'<p>Tamamlanma '+esc(j.completed)+'</p>':'')+'<section class="'+(j.printMaterials?'':'screen')+'"><h3>Malzemeler</h3>'+j.materials.map((m,i)=>'<div>'+esc(m.name)+' · '+m.qty+' × '+fmt(m.price)+' = '+fmt(m.qty*m.price)+' <button class="screen" data-edit="'+i+'">Düzenle</button></div>').join('')+'<p>Toplam '+fmt(j.materials.reduce((s,m)=>s+m.qty*m.price,0))+'</p></section></article>'+serviceNote(j)+'<div class="screen">'+form('material',materialNameFields(j.trade)+field('Miktar','qty','number','1','required step="any" min="0.000001"')+field('Birim bedeli (₺)','price','number','','required step="0.01" min="0"'),'Malzemeyi kaydet')+'<label><input type="checkbox" id="include" '+(j.printMaterials?'checked':'')+'> PDF’de malzemeleri göster</label><button id="print">Yazdır / PDF kaydet</button> '+whatsAppMessage(j,name(j),phone)+(j.status==='active'?form('move',field('Yeni tarih ve saat','date','datetime-local',j.date),'Yeniden planla')+'<button id="done">İş yapıldı</button> <button id="cancel">Randevuyu iptal et</button>':'')+(j.status==='done'?btn('Kontrol takibini aç','maintenance'):'')+'</div>'}
else{
const dueCount=db.jobs.filter(job=>job.status==='done').flatMap(checkpoints).filter(p=>!p.checked && p.date<=today()).length;
const upcoming = jobsFor(db,'active').filter(x=>x.date>=today()+'T'+new Date().toTimeString().slice(0,5)).slice(0,3);
h='<section class="hero"><time>'+esc(new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long'}).format(new Date()))+'</time><h2>İş takibi</h2>'+btn('Randevu oluştur','week')+'</section><div class="cards">'+
['all','active','done','cancel'].map(k=>'<a class="stat '+k+'" href="#list/'+k+'"><span class="status-icon">'+statusIcons[k]+'</span><strong>'+jobsFor(db,k).length+'</strong><span>'+esc(labels[k]||'Toplam iş')+'</span></a>').join('')+'</div>'+(dueCount?btn('Kontrol zamanı gelen işler · '+dueCount,'maintenance'):'')+'<section class="panel"><h3>Yaklaşan randevular</h3>'+(upcoming.length?list(upcoming):'<div class="empty"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v15H4z M4 11h16 M8 3v5 M16 3v5"/></svg><p>Yaklaşan randevu yok.</p></div>')+'</section><details><summary>Yedekleme ve geri yükleme</summary><button id="backup" type="button">Kayıtları yedekle</button><label>Yedekten kayıt ekle<input type="file" accept=".json,application/json" id="restore"></label></details>'}
root.innerHTML=h;
if(page==='week' && root.querySelector('[name=planCustomer]')){
  const pick=location.hash.split('/')[2];
  if(db.customers.some(c=>c.id===pick))root.querySelector('[name=planCustomer]').value=pick;
}
const selected = {customers:'#customers',customer:'#customers',maintenance:'#maintenance',list:'#week',job:'#week',week:'#week','new-for-day':'#week'}[page] || '#';
document.querySelectorAll('nav a').forEach(a=>{if(a.getAttribute('href')===selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
root.onchange = async e => {
  if(e.target.form?.id==='work-hours' && e.target.type==='checkbox'){
    for(const input of e.target.closest('fieldset').querySelectorAll('input[type=time]')){
      input.disabled=!e.target.checked;
      input.required=e.target.checked;
    }
    return;
  }
  if (e.target.name === 'materialSuggestion') {
    if (e.target.value) e.target.form.elements.namedItem('name').value = e.target.value;
    e.target.selectedIndex = 0;
    return;
  }
  if (e.target.name === 'trade') {
    const custom = e.target.form.elements.customTrade;
    const other = e.target.value === '__other';
    custom.disabled = !other;
    custom.required = other;
    custom.parentElement.hidden = !other;
    const options = e.target.form.querySelector('.task-options');
    options.hidden = !Object.hasOwn(tradeJobs, e.target.value);
    options.querySelector('div').innerHTML = options.hidden ? '' : jobOptions(e.target.value);
    if (other) custom.focus();
    return;
  }
  if (e.target.id !== 'restore') return;
  const file = e.target.files[0];
  if (!file) return;
  try {
    const backup = readBackup(await file.text());
    const latest = JSON.parse(localStorage.getItem(key) || '{"customers":[],"jobs":[]}');
    const customerIds = new Set(latest.customers.map(c => c.id));
    const jobIds = new Set(latest.jobs.map(j => j.id));
    const customers = backup.customers.filter(c => !customerIds.has(c.id));
    const jobs = backup.jobs.filter(j => !jobIds.has(j.id));
    if (!customers.length && !jobs.length) { alert('Bu yedekte eklenecek yeni kayıt yok.'); return; }
    if (!confirm(customers.length+' müşteri ve '+jobs.length+' iş eklensin mi? Mevcut kayıtlar korunur.')) return;
    latest.customers.push(...customers);
    latest.jobs.push(...jobs);
    localStorage.setItem(key, JSON.stringify(latest));
    render();
    alert('Kayıtlar eklendi.');
  } catch { alert('Yedek yüklenemedi. Dosyayı ve cihazdaki boş alanı kontrol edin.'); }
  finally { e.target.value = ''; }
};
root.oninput = e => {
  if (e.target.id === 'customer-search') {
    document.getElementById('customer-results').innerHTML = customerResults(db.customers, e.target.value);
  }
};
function changeCheckpoint(element, patch) {
  const job=db.jobs.find(item=>item.id===element.dataset.job && item.status==='done');
  if (!job) return;
  const point=checkpoints(job)[Number(element.dataset.index)];
  if (!point) return;
  job.followups={...job.followups,[point.index]:{date:point.date,checked:point.checked,...patch(point)}};
  save();
}
let editing=null;function save(path){try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('Kayıt bu cihaza kaydedilemedi.');render();return}if(path)location.hash=path;render()}
root.onsubmit=e=>{e.preventDefault();let f=e.target,d=new FormData(f),v=n=>String(d.get(n)||'').trim();if(f.elements.name&&!v('name')||f.elements.title&&!f.elements.title.disabled&&!v('title'))return;
if(f.id==='work-hours'){
  const hours=workDays.map((_,i)=>({open:d.has('open'+i),start:f.elements['start'+i].value || '00:00',end:f.elements['end'+i].value || '23:59'}));
  const invalid=hours.findIndex(day=>day.open && day.start>day.end);
  if(invalid!==-1){alert(workDays[invalid]+' için son randevu ilk randevudan önce olamaz.');return;}
  db.workHours=hours;save();return;
}
if(f.className==='followup-date'){const due=v('due');if(/^\d{4}-\d{2}-\d{2}$/.test(due))changeCheckpoint(f,()=>({date:due}));return}
if(f.id==='edit-customer'){c.name=v('name');c.phone=v('phone');c.address=v('address');save();return}
if(f.id==='customer'){let x={id:uid(),name:v('name'),phone:v('phone'),address:v('address')};db.customers.push(x);save(page==='new-for-day'?'week/'+dayKey(localDay(id))+'/'+x.id:'customer/'+x.id)}
if(f.id==='book' || f.id==='record-service'){
  const tasks = [];
  const seen = new Set();
  for (const entry of [...d.getAll('task'), ...v('customTasks').split(/\r?\n/)]) {
    const task = entry.trim();
    const normalized = task.toLocaleLowerCase('tr-TR');
    if (task && !seen.has(normalized)) { tasks.push(task); seen.add(normalized); }
  }
  if (!tasks.length) {
    alert('En az bir iş seçin veya yazın.');
    f.elements.customTasks.focus();
    return;
  }
  const completed = f.id==='record-service';
  const date = page==='week' ? dayKey(localDay(id))+'T'+v('planTime') : v('date');
  if(completed && date > today()+'T'+new Date().toTimeString().slice(0,5)){alert('Yapılan servis için geçmiş bir saat seçin.');return}
  if(!completed && !confirmAppointmentTime(db,date))return;
  const x={id:uid(),customer:page==='week'?v('planCustomer'):id,tasks,title:tasks.join(' · '),date,status:completed?'done':'active',trade:v('trade')==='__other'?v('customTrade'):v('trade'),serviceType:v('serviceType'),subject:v('subject'),request:v('request'),materials:[],printMaterials:true};
  if(completed){x.directService=true;x.completed=date.slice(0,10);x.maintenance=x.serviceType.toLocaleLowerCase('tr-TR').includes('bakım')}
  db.jobs.push(x);save('job/'+x.id)
}
if(f.id==='service-note'){j.note=v('note');save();return}
if(f.id==='move'){if(!confirmAppointmentTime(db,v('date'),j.id))return;j.date=v('date');save()}
if(f.id==='material'){let m={name:v('name'),qty:Number(v('qty')),price:Number(v('price'))};if(editing===null)j.materials.push(m);else j.materials[editing]=m;save()}};
root.onclick=e=>{let t=e.target;if(t.dataset.check==='toggle'){changeCheckpoint(t,p=>({checked:p.checked?'':today()}));return}if(t.id==='backup'){downloadBackup(db);return}if(t.dataset.edit!==undefined){editing=Number(t.dataset.edit);let f=document.querySelector('#material');for(let [k,v] of ['name','qty','price'].map(k=>[k,j.materials[editing][k]]))f.elements[k].value=v;f.elements.name.focus()}
if(t.id==='include'){j.printMaterials=t.checked;save()}if(t.id==='print')window.print();if(t.id==='done'){j.status='done';j.completed=today();j.maintenance=!j.serviceType || j.serviceType.toLocaleLowerCase('tr-TR').includes('bakım');save()}if(t.id==='cancel'&&confirm('Bu randevu iptal edilsin mi?')){j.status='cancel';save()}}
}
document.getElementById('demo-share').onclick=async()=>{
 const url=document.querySelector('.share-panel a').href;
 try{
   if(navigator.share){await navigator.share({title:'İş Bitti',text:'Mobil servis ve randevu panelini örnek kayıtlarla deneyin.',url});return}
   await navigator.clipboard.writeText(url);

 }catch(error){if(error.name!=='AbortError')prompt('Tanıtım bağlantısını kopyalayın',url)}
};
