<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İş Bitti</title><style>
:root{--ink:#172521;--green:#123d34;--gold:#c9aa74;--line:#d9ded5;color:var(--ink);background:#f6f5ef;font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:auto;max-width:980px;padding:0 24px 96px}header{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:18px 0}header h1{display:flex;align-items:center;gap:10px;font-size:23px;letter-spacing:-1px;margin:0}header h1:before{content:"✓";display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#f1dcad;background:var(--green);font-size:20px}nav{display:flex;gap:8px}a{color:inherit;text-decoration:none}nav a{padding:10px;font-weight:600;color:#56645c}nav a[aria-current]{background:#e4ebe1;color:var(--green);border-radius:12px}main{padding:25px 0}h2{font-size:clamp(28px,5vw,42px);letter-spacing:-.055em;margin:0 0 18px}h3{font-size:20px;letter-spacing:-.035em}.hero{background:linear-gradient(115deg,#10392f,#215043);border-radius:20px;color:#fff;padding:24px;margin-bottom:14px}.hero time{color:#e3cda4;font-size:14px}.hero h2{margin:5px 0 16px}.hero a{display:inline-flex;align-items:center;min-height:44px;background:#f4e4c6;color:#22392c;border-radius:10px;padding:8px 15px;font-weight:650}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{display:grid;position:relative;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat:after{content:"↗";position:absolute;right:12px;top:10px;color:#738178}.stat strong{font-size:32px;line-height:1;font-variant-numeric:tabular-nums}.stat span{font-size:14px;color:#46554c}.stat.active{border-top:3px solid #a37831}.stat.done{border-top:3px solid #44765e}.button{display:block;padding:14px 15px;background:white;border:1px solid var(--line);border-radius:12px;margin:7px 0;overflow-wrap:anywhere}.panel,form,article,details{background:white;border:1px solid var(--line);padding:16px;border-radius:16px;margin:14px 0}.panel h3{margin:0 0 8px}.panel p{color:#59665e}button{border:0;border-radius:10px;background:var(--green);color:white;padding:12px 16px;min-height:44px;font:inherit;font-weight:600;cursor:pointer;margin:4px 0}summary{cursor:pointer;padding:4px;font-weight:650}input:not([type=checkbox]){display:block;width:100%;min-width:0;margin:5px 0;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px}label{display:block;margin:10px 0}footer{font-size:13px;color:#60695f}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #997126;outline-offset:2px}
@media(max-width:680px){body{padding:0 16px calc(90px + env(safe-area-inset-bottom))}header{padding:13px 0}main{padding:16px 0}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}nav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:6px 5px calc(6px + env(safe-area-inset-bottom))}nav a{font-size:12px;text-align:center;padding:7px 0}nav i{display:block;font-style:normal;font-size:20px;line-height:21px}}@media(min-width:681px){nav i{display:none}}@media print{header,footer,.screen,button{display:none!important}body,main,article{background:white;padding:0;margin:0;border:0}}
@media screen{
:root{--ink:#f6f2e8;--green:#314f48;--gold:#e5c28b;--line:#344039;background:#111915;color:var(--ink);color-scheme:dark}
body{max-width:1040px}header{padding:18px 0}header h1{letter-spacing:-.055em}header h1:before{border:1px solid #9d885f;background:#24372d;color:var(--gold)}
nav{background:#19241e}nav a{color:#b6c2b9}nav a[aria-current]{background:#303e33;color:#f0d4a1}nav svg{width:19px;height:19px;vertical-align:middle;margin:0 6px}
.hero{background:radial-gradient(ellipse at 100% 15%,#385849,transparent 65%),#1c332c;border:1px solid #52604d;position:relative;isolation:isolate;overflow:hidden;padding:clamp(21px,4vw,40px)}
.hero:after{content:"";position:absolute;z-index:-1;right:-42px;bottom:-100px;width:210px;height:210px;border:1px solid #b9ae8145;border-radius:50%;box-shadow:0 0 0 19px #b9ae8111,0 0 0 40px #b9ae8110,0 0 0 62px #b9ae8110}
.hero h2{font:500 clamp(40px,7vw,64px)/1.08 Georgia,serif;letter-spacing:-.045em}.hero time{text-transform:capitalize}.hero a,button{background:#e8cf9f;color:#202920;font-weight:650}.hero a{border:0;padding-inline:18px}
.stat,.panel,form,article,details,.button{background:#1b2520;border-color:var(--line)}.stat{gap:7px;padding:16px;grid-template-columns:1fr auto;align-items:center}.stat.active,.stat.done{border:1px solid var(--line)}.stat:after{content:none}.stat strong{grid-column:1;grid-row:1;font-size:36px;letter-spacing:-.07em}.stat .status-icon{grid-column:2;grid-row:1;display:grid;place-items:center;width:32px;height:32px;background:#304136;color:#cbdacb;border-radius:10px}.stat.active .status-icon{background:#433928;color:#efc988}.stat.cancel .status-icon{background:#433331;color:#dab6ac}.stat svg,.empty svg{width:18px;height:18px}.stat span,.panel p,footer{color:#bcc7bc}.stat span:last-child{grid-column:1/-1}.panel h3,summary{font-weight:600}.empty{display:flex;gap:11px;align-items:center;border-top:1px solid var(--line);padding:12px 0 0}.empty svg{color:var(--gold)}.empty p{margin:0}.job-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:13px 2px}.job-time,.job-label{display:grid;gap:2px}.job-time{color:var(--gold);font-variant-numeric:tabular-nums}.job-label{flex:1;min-width:0;overflow-wrap:anywhere}small{font-size:12px;color:#bdc7bb}.pill{font-size:11px;color:#d6dfd1;background:#304038;border-radius:8px;padding:4px 7px}.pill.active{color:#ead0a2;background:#443a2c}input:not([type=checkbox]){background:#121c17;color:var(--ink)}details summary{color:#e0c79c}a:active,button:active{filter:brightness(.88)}
@media(max-width:680px){nav{background:#18241e;border-color:#3e4c40}nav svg{display:block;margin:0 auto 3px}.hero{margin-top:0}.cards{gap:8px}.stat{padding:13px}.pill{max-width:76px}.panel{padding:16px}.job-row{gap:8px}}
}@media print{.job-row{color:black}svg{width:16px;height:16px}}.service-address{border-inline-start:3px solid var(--gold);padding:4px 16px;margin:16px 0;overflow-wrap:anywhere}.service-address h3,.service-address p{margin:3px 0}.service-address a{display:inline-flex;align-items:center;min-height:44px;color:var(--gold);text-decoration:underline}textarea{display:block;width:100%;margin-top:6px;padding:12px;font:inherit;font-size:16px;color:var(--ink);background:#121c17;border:1px solid var(--line);border-radius:8px;resize:vertical}.note-text{white-space:pre-wrap;overflow-wrap:anywhere}.panel details form{border:0;padding:0}</style><header><h1>İş Bitti</h1><nav><a href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3z"/></svg>Ana ekran</a><a href="#customers"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 20H3v-2a6 6 0 0 1 12 0z M12 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0z M16 5a3 3 0 0 1 0 6 M18 14q3 1 3 5"/></svg>Müşteriler</a><a href="#list/active"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v15H4z M4 11h16 M8 3v5 M16 3v5"/></svg>Randevular</a><a href="#maintenance"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7a8 8 0 1 0 0 10 M20 3v5h-5"/></svg>Bakım</a></nav></header><main></main><footer>Kayıtlar bu tarayıcıda saklanır.</footer><script>
const key='is-bitti-yerel-v1', root=document.querySelector('main');
const fmt=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.getRandomValues(new Uint32Array(4)).join('-');
const labels={active:'Devam eden',done:'Yapılan işler',cancel:'İptal edilen'};
function jobsFor(db,type){return db.jobs.filter(j=>type==='all'||j.status===type).sort((a,b)=>a.date.localeCompare(b.date))}
function anniversary(day){const [y,m,d]=day.slice(0,10).split('-').map(Number);return [y+1,String(m).padStart(2,'0'),String(Math.min(d,new Date(y+1,m,0).getDate())).padStart(2,'0')].join('-')}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const btn=(label,path)=>'<a class="button" href="#'+path+'">'+esc(label)+'</a>';
const field=(label,name,type='text',val='',extra='required')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(val)+'" '+extra+'></label>';
const form=(id,body,label)=>'<form id="'+id+'">'+body+'<button>'+label+'</button></form>';
function customerResults(customers, query) {
  const needle = query.trim().toLocaleLowerCase('tr-TR');
  const digits = /^[+\d\s()-]+$/.test(needle) ? needle.replace(/\D/g, '') : '';
  const matches = customers.filter(c => c.name.toLocaleLowerCase('tr-TR').includes(needle)
    || (digits && (c.phone || '').replace(/\D/g, '').includes(digits)));
  return matches.map(c => btn(c.name, 'customer/' + c.id)).join('')
    || (needle ? '<p>Eşleşen müşteri yok.</p>' : '<p>Henüz müşteri kaydı yok.</p>');
}
const addressField = value => field('Servis adresi (isteğe bağlı)', 'address', 'text', value || '', '');
function addressCard(customer) {
  const address = customer?.address?.trim();
  if (!address) return '';
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return '<section class="service-address screen"><h3>Servis adresi</h3><p>' + esc(address) +
    '</p><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Haritada aç ↗</a></section>';
}
function serviceNote(job) {
  const note = job.note || '';
  const label = note ? 'Servis notunu düzenle' : 'Servis notu ekle';
  return '<section class="panel screen"><h3>Servis notu</h3>' +
    (note ? '<p class="note-text">' + esc(note) + '</p>' : '') +
    '<details><summary>' + label + '</summary>' +
    form('service-note', '<label>İşe özel not<textarea name="note" rows="4">' +
      esc(note) + '</textarea></label>', 'Notu kaydet') + '</details></section>';
}
function downloadBackup(records) {
  const timestamp = new Date();
  const payload = { application: 'İş Bitti', formatVersion: 1, exportedAt: timestamp.toISOString(), records };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'is-bitti-yedek-' + timestamp.toISOString().replace(/[:.]/g, '-') + '.json';
  document.body.appendChild(link);
  try { link.click(); } finally {
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
}
function readBackup(text) {
  const file = JSON.parse(text);
  const records = file?.records;
  const reject = () => { throw Error('Geçersiz İş Bitti yedeği.'); };
  if (file?.application !== 'İş Bitti' || file.formatVersion !== 1 ||
      !Array.isArray(records?.customers) || !Array.isArray(records?.jobs)) reject();
  const validId = id => typeof id === 'string' && /^[a-zA-Z0-9_-]+$/.test(id);
  const nonempty = value => typeof value === 'string' && value.trim().length > 0;
  const customers = new Set(), jobs = new Set();
  for (const c of records.customers) {
    if (!c || !validId(c.id) || customers.has(c.id) || !nonempty(c.name) ||
        typeof c.phone !== 'string' || (c.address != null && typeof c.address !== 'string')) reject();
    customers.add(c.id);
  }
  for (const j of records.jobs) {
    if (!j || !validId(j.id) || jobs.has(j.id) || !customers.has(j.customer) ||
        !nonempty(j.title) || !nonempty(j.date) || !/^\d{4,}-\d\d-\d\dT\d\d:\d\d/.test(j.date) ||
        !Object.hasOwn(labels,j.status) || !Array.isArray(j.materials) || (j.note != null && typeof j.note !== 'string') ||
        (j.completed != null && (typeof j.completed !== 'string' || !/^\d{4}-\d\d-\d\d$/.test(j.completed))) ||
        j.materials.some(m => !m || !nonempty(m.name) || !Number.isFinite(m.qty) || m.qty <= 0 ||
          !Number.isFinite(m.price) || m.price < 0)) reject();
    jobs.add(j.id);
  }
  return records;
}
const statusIcons={"all":"<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16v13H4z M9 7V4h6v3 M4 12q8 4 16 0\"/></svg>","active":"<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3a9 9 0 1 0 .01 0 M12 7v6l4 2\"/></svg>","done":"<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12l5 5L20 6\"/></svg>","cancel":"<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 5l14 14 M19 5 5 19\"/></svg>"};
function render(){
let db;try{db=JSON.parse(localStorage.getItem(key)||'{"customers":[],"jobs":[]}');if(!Array.isArray(db.jobs)||!Array.isArray(db.customers))throw Error()}catch{root.textContent='Cihazdaki kayıtlar okunamadı.';return}
const [page,id]=location.hash.slice(1).split('/'), c=db.customers.find(x=>x.id===id),j=db.jobs.find(x=>x.id===id);
const name=j=>db.customers.find(c=>c.id===j.customer)?.name||'Müşteri';
const list = rows => rows.length ? rows.map(x =>
  '<a class="job-row" href="#job/'+esc(x.id)+'"><span class="job-time">'+esc(x.date.slice(11,16))+'<small>'+esc(x.date.slice(8,10)+'.'+x.date.slice(5,7))+'</small></span><span class="job-label"><b>'+esc(name(x))+'</b><small>'+esc(x.title)+'</small></span><span class="pill '+x.status+'">'+esc(labels[x.status])+'</span></a>').join('') : '<p>Kayıt yok.</p>';
let h='';
if(page==='list'){h='<h2>'+esc(labels[id]||'Toplam iş')+'</h2>'+list(jobsFor(db,id))}
else if(page==='customers'){h='<h2>Müşteriler</h2><label>Müşteri ara<input id="customer-search" type="search" placeholder="Ad veya telefon numarası"></label><div id="customer-results">'+customerResults(db.customers,'')+'</div>'+form('customer',field('Müşteri adı','name')+field('WhatsApp numarası (isteğe bağlı)','phone','tel','','')+addressField(''),'Müşteri ekle')}
else if(page==='customer'&&c){h='<h2>'+esc(c.name)+'</h2>'+addressCard(c)+'<details><summary>Müşteri bilgilerini düzenle</summary>'+form('edit-customer',field('Müşteri adı','name','text',c.name)+field('Telefon','phone','tel',c.phone,'')+addressField(c.address),'Değişiklikleri kaydet')+'</details>'+form('book',field('Yapılacak iş','title')+field('Randevu tarihi ve saati','date','datetime-local'),'Randevu oluştur')+'<h3>Müşteri geçmişi</h3>'+list(jobsFor(db,'all').filter(x=>x.customer===id))}
else if(page==='maintenance'){let rows=db.jobs.filter(x=>x.maintenance&&x.completed).sort((a,b)=>a.completed.localeCompare(b.completed));h='<h2>Yıllık bakım hatırlatmaları</h2>'+ (rows.map(x=>btn((anniversary(x.completed)<=today()?'Bakım zamanı · ':'')+anniversary(x.completed)+' · '+name(x)+' · '+x.title,'job/'+x.id)).join('')||'<p>Bakım kaydı yok.</p>')}
else if(page==='job'&&j){let phone=String(db.customers.find(x=>x.id===j.customer)?.phone||'').replace(/\D/g,'');if(/^0\d{10}$/.test(phone))phone='90'+phone.slice(1);if(/^\d{10}$/.test(phone))phone='90'+phone;
h='<article><h2>'+esc(j.title)+'</h2><p>'+esc(name(j))+' · '+esc(labels[j.status])+'</p><p>Randevu '+esc(j.date.replace('T',' '))+'</p>'+addressCard(db.customers.find(customer => customer.id === j.customer))+(j.completed?'<p>Tamamlanma '+esc(j.completed)+'</p>':'')+'<section class="'+(j.printMaterials?'':'screen')+'"><h3>Malzemeler</h3>'+j.materials.map((m,i)=>'<div>'+esc(m.name)+' · '+m.qty+' × '+fmt(m.price)+' = '+fmt(m.qty*m.price)+' <button class="screen" data-edit="'+i+'">Düzenle</button></div>').join('')+'<p>Toplam '+fmt(j.materials.reduce((s,m)=>s+m.qty*m.price,0))+'</p></section></article>'+serviceNote(j)+'<div class="screen">'+form('material',field('Malzeme adı','name')+field('Miktar','qty','number','1','required step="any" min="0.000001"')+field('Birim bedeli (₺)','price','number','','required step="0.01" min="0"'),'Malzemeyi kaydet')+'<label><input type="checkbox" id="include" '+(j.printMaterials?'checked':'')+'> PDF’de malzemeleri göster</label><button id="print">Yazdır / PDF kaydet</button> '+(phone?'<a class="button" target="_blank" rel="noopener" href="https://wa.me/'+phone+'?text='+encodeURIComponent('Merhaba '+name(j)+', '+j.title+' hakkında size ulaşıyorum.')+'">WhatsApp mesajı hazırla</a>':'')+(j.status==='active'?form('move',field('Yeni tarih ve saat','date','datetime-local',j.date),'Yeniden planla')+'<button id="done">İş yapıldı</button> <button id="cancel">Randevuyu iptal et</button>':'')+(j.status==='done'?'<label><input id="maint" type="checkbox" '+(j.maintenance?'checked':'')+'> Bir yıl sonra bakım hatırlat</label>':'')+'</div>'}
else{
const upcoming = jobsFor(db,'active').filter(x=>x.date>=today()+'T'+new Date().toTimeString().slice(0,5)).slice(0,3);
h='<section class="hero"><time>'+esc(new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long'}).format(new Date()))+'</time><h2>İş takibi</h2>'+btn('Randevu oluştur','customers')+'</section><div class="cards">'+
['all','active','done','cancel'].map(k=>'<a class="stat '+k+'" href="#list/'+k+'"><span class="status-icon">'+statusIcons[k]+'</span><strong>'+jobsFor(db,k).length+'</strong><span>'+esc(labels[k]||'Toplam iş')+'</span></a>').join('')+'</div><section class="panel"><h3>Yaklaşan randevular</h3>'+(upcoming.length?list(upcoming):'<div class="empty"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v15H4z M4 11h16 M8 3v5 M16 3v5"/></svg><p>Yaklaşan randevu yok.</p></div>')+'</section><details><summary>Yedekleme ve geri yükleme</summary><button id="backup" type="button">Kayıtları yedekle</button><label>Yedekten kayıt ekle<input type="file" accept=".json,application/json" id="restore"></label></details>'}
root.innerHTML=h;
const selected = {customers:'#customers',customer:'#customers',maintenance:'#maintenance',list:'#list/active',job:'#list/active'}[page] || '#';
document.querySelectorAll('nav a').forEach(a=>{if(a.getAttribute('href')===selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
root.onchange = async e => {
  if (e.target.id !== 'restore') return;
  const file = e.target.files[0];
  if (!file) return;
  try {
    const backup = readBackup(await file.text());
    const latest = JSON.parse(localStorage.getItem(key) || '{"customers":[],"jobs":[]}');
    const customerIds = new Set(latest.customers.map(c => c.id));
    const jobIds = new Set(latest.jobs.map(j => j.id));
    const customers = backup.customers.filter(c => !customerIds.has(c.id));
    const jobs = backup.jobs.filter(j => !jobIds.has(j.id));
    if (!customers.length && !jobs.length) { alert('Bu yedekte eklenecek yeni kayıt yok.'); return; }
    if (!confirm(customers.length+' müşteri ve '+jobs.length+' iş eklensin mi? Mevcut kayıtlar korunur.')) return;
    latest.customers.push(...customers);
    latest.jobs.push(...jobs);
    localStorage.setItem(key, JSON.stringify(latest));
    render();
    alert('Kayıtlar eklendi.');
  } catch { alert('Yedek yüklenemedi. Dosyayı ve cihazdaki boş alanı kontrol edin.'); }
  finally { e.target.value = ''; }
};
root.oninput = e => {
  if (e.target.id === 'customer-search') {
    document.getElementById('customer-results').innerHTML = customerResults(db.customers, e.target.value);
  }
};
let editing=null;function save(path){try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('Kayıt bu cihaza kaydedilemedi.');render();return}if(path)location.hash=path;render()}
root.onsubmit=e=>{e.preventDefault();let f=e.target,d=new FormData(f),v=n=>String(d.get(n)||'').trim();if(f.elements.name&&!v('name')||f.elements.title&&!v('title'))return;
if(f.id==='edit-customer'){c.name=v('name');c.phone=v('phone');c.address=v('address');save();return}
if(f.id==='customer'){let x={id:uid(),name:v('name'),phone:v('phone'),address:v('address')};db.customers.push(x);save('customer/'+x.id)}
if(f.id==='book'){let x={id:uid(),customer:id,title:v('title'),date:v('date'),status:'active',materials:[],printMaterials:true};db.jobs.push(x);save('job/'+x.id)}
if(f.id==='service-note'){j.note=v('note');save();return}
if(f.id==='move'){j.date=v('date');save()}
if(f.id==='material'){let m={name:v('name'),qty:Number(v('qty')),price:Number(v('price'))};if(editing===null)j.materials.push(m);else j.materials[editing]=m;save()}};
root.onclick=e=>{let t=e.target;if(t.id==='backup'){downloadBackup(db);return}if(t.dataset.edit!==undefined){editing=Number(t.dataset.edit);let f=document.querySelector('#material');for(let [k,v] of ['name','qty','price'].map(k=>[k,j.materials[editing][k]]))f.elements[k].value=v;f.elements.name.focus()}
if(t.id==='include'){j.printMaterials=t.checked;save()}if(t.id==='maint'){j.maintenance=t.checked;save()}if(t.id==='print')window.print();if(t.id==='done'){j.status='done';j.completed=today();j.maintenance=true;save()}if(t.id==='cancel'&&confirm('Bu randevu iptal edilsin mi?')){j.status='cancel';save()}}
}
window.addEventListener('hashchange',render);window.addEventListener('storage',render);render();
</script></html>
